[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memloom"
version = "0.1.3"
description = "Turn your AI coding sessions into a navigable Obsidian memory vault. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kirito" }]
keywords = [
  "ai",
  "coding-agent",
  "sessions",
  "obsidian",
  "knowledge-base",
  "claude-code",
  "codex",
  "deepseek-harness",
  "memory",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/KrLito7/memloom"
Issues = "https://github.com/KrLito7/memloom/issues"

[project.optional-dependencies]
# Only needed to read DeepSeek Harness `.jsonl.zstd` archives.
# Python >= 3.14 has compression.zstd in the stdlib; a local `node` also works.
zstd = ["pyzstd>=0.15"]
dev = ["pytest>=7"]

[project.scripts]
memloom = "memloom.cli:main"

[tool.setuptools.packages.find]
include = ["memloom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
